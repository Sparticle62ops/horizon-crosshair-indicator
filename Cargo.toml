[package]
name = "horizon-mod-crosshair-indicator"
version = "1.0.1"
edition = "2024"
license = "MIT"
publish = false
description = "Crosshair Indicator ported to Horizon: dynamic target-reach feedback at your crosshair. Exact 1:1 port of CayMac97/crosshair-indicator (MIT, CayMac), itself a 1:1 port of AmerDz01's Java Crosshair Indicator."

[lib]
path = "src/lib.rs"

[dependencies]
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }
serde_json = "1"
